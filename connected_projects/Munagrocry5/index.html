<!DOCTYPE html>
<html lang="or">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Munna Mobile & Grocery</title>
  <meta name="description" content="Niali online grocery and mobile accessories delivery store with live tracking, bilingual Odia-English catalog, map-based 3KM delivery check, and checkout.">
  
  <!-- PWA & Theme -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c2340">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Munna Mobile & Grocery">

  <!-- Open Graph / WhatsApp / Facebook Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.munagrocery.in/" />
  <meta property="og:title" content="Munna Mobile & Grocery - Niali" />
  <meta property="og:description" content="Order grocery, daily essentials, and mobile accessories with fast store pickup and local delivery in Niali." />
  <meta property="og:image" content="https://www.munagrocery.in/banner.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Munna Mobile & Grocery - Niali" />
  <meta name="twitter:description" content="Order grocery & mobile accessories online in Niali." />
  <meta name="twitter:image" content="https://www.munagrocery.in/banner.jpg" />

  <!-- Google Fonts: Noto Sans Oriya & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS for 3KM Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Phosphor Icons web fonts -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
</head>
<body class="antialiased select-none font-['Noto_Sans_Oriya',_'Plus_Jakarta_Sans',_sans-serif] bg-[#f1f3f6] text-[#111]">
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

</html>
